<svg width="1536" height="512" viewBox="0 0 1536 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1830"/>
      <stop offset="0.55" stop-color="#0a1426"/>
      <stop offset="1" stop-color="#070e1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8fb8ff" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#5d8fe8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#5d8fe8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3d6fd6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3d6fd6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#182a4a" stroke-width="1"/>
    </pattern>
    <linearGradient id="cardbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13223c"/>
      <stop offset="1" stop-color="#0e1a30"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1536" height="512" fill="url(#bg)"/>
  <rect width="1536" height="512" fill="url(#grid)" opacity="0.55"/>

  <!-- aurora beams -->
  <ellipse cx="500" cy="70" rx="640" ry="110" fill="url(#glow)" filter="url(#soft)" transform="rotate(-16 500 70)"/>
  <ellipse cx="1180" cy="470" rx="480" ry="130" fill="url(#glow2)" filter="url(#soft)" transform="rotate(-12 1180 470)"/>
  <ellipse cx="180" cy="440" rx="300" ry="90" fill="url(#glow2)" filter="url(#soft)" opacity="0.6"/>

  <!-- title block -->
  <g font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="96" y="205" font-size="84" font-weight="700" fill="#f3f8ff" letter-spacing="1">dsh-vsceditor</text>
    <text x="99" y="256" font-size="23" fill="#9db6dd">VS Code Integrado para DeepSeek Harness</text>
    <text x="99" y="296" font-size="21" fill="#6e86ad">Acompanhe a IA codando ao vivo: diff interativo · bloqueio de arquivos · dual backend</text>

    <!-- feature badges -->
    <g font-size="16" fill="#a9c3ea" text-anchor="middle">
      <rect x="99" y="338" width="150" height="34" rx="17" fill="#12233f" stroke="#2a4268"/>
      <text x="174" y="360">🔴🟢 live diff</text>
      <rect x="263" y="338" width="140" height="34" rx="17" fill="#12233f" stroke="#2a4268"/>
      <text x="333" y="360">🔒 file lock</text>
      <rect x="417" y="338" width="160" height="34" rx="17" fill="#12233f" stroke="#2a4268"/>
      <text x="497" y="360">🖥 dual backend</text>
    </g>
  </g>

  <!-- right: mock diff editor card -->
  <g>
    <rect x="920" y="96" width="520" height="322" rx="16" fill="#0d1930" stroke="#27406a" stroke-width="1.5"/>
    <rect x="920" y="96" width="520" height="42" rx="16" fill="url(#cardbar)"/>
    <rect x="920" y="122" width="520" height="16" fill="url(#cardbar)"/>
    <circle cx="948" cy="117" r="5.5" fill="#ff5f57"/>
    <circle cx="968" cy="117" r="5.5" fill="#febc2e"/>
    <circle cx="988" cy="117" r="5.5" fill="#28c840"/>
    <g font-family="'SF Mono', Menlo, Consolas, monospace">
      <rect x="936" y="150" width="160" height="28" rx="6" fill="#182a49"/>
      <text x="952" y="169" font-size="14" fill="#c9daef">cart.ts ⇄ diff</text>

      <!-- code lines -->
      <g font-size="14">
        <text x="940" y="208" fill="#40587e">12</text>
        <rect x="972" y="196" width="170" height="12" rx="4" fill="#22395f"/>
        <text x="940" y="236" fill="#40587e">13</text>
        <rect x="972" y="224" width="270" height="12" rx="4" fill="#22395f"/>

        <!-- removed line -->
        <rect x="928" y="248" width="504" height="26" fill="#f85149" opacity="0.12"/>
        <rect x="928" y="248" width="3" height="26" fill="#f85149"/>
        <text x="940" y="266" fill="#e8958f">14</text>
        <rect x="972" y="254" width="330" height="12" rx="4" fill="#a44a4a" opacity="0.85"/>
        <text x="1420" y="266" font-size="12" fill="#f85149" text-anchor="end">− removido</text>

        <!-- added line -->
        <rect x="928" y="278" width="504" height="26" fill="#3fb950" opacity="0.12"/>
        <rect x="928" y="278" width="3" height="26" fill="#3fb950"/>
        <text x="940" y="296" fill="#7ee2a0">15</text>
        <rect x="972" y="284" width="390" height="12" rx="4" fill="#3f8f5f" opacity="0.9"/>
        <text x="1420" y="296" font-size="12" fill="#3fb950" text-anchor="end">+ adicionado</text>

        <text x="940" y="334" fill="#40587e">16</text>
        <rect x="972" y="322" width="220" height="12" rx="4" fill="#22395f"/>
        <text x="940" y="362" fill="#40587e">17</text>
        <rect x="972" y="350" width="140" height="12" rx="4" fill="#22395f"/>
      </g>

      <!-- status pill -->
      <rect x="936" y="382" width="210" height="28" rx="14" fill="#102540" stroke="#2a4a78"/>
      <circle cx="954" cy="396" r="5" fill="#3fb950"/>
      <text x="968" y="401" font-size="13" fill="#a9c3ea" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif">DSH Bridge · Seguindo</text>
    </g>
  </g>
</svg>
